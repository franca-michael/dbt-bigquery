[project]
name = "my-dbt-project-bigquery"
version = "0.1.0"
description = "Repositorio dbt + Bigquery"
authors = [
    {name = "Michael",email = "michael.mjpr@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dbt-core (>=1.12.3,<2.0.0)",
    "dbt-bigquery (>=1.12.0,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "pre-commit (>=4.6.2,<5.0.0)",
    "sqlfluff (>=4.3.0,<5.0.0)"
]
